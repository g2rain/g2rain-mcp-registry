name: Publish GHCR image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Verify and publish GHCR image
    runs-on: ubuntu-latest
    steps:
      # v6.0.3
      - name: Check out the release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      # v5.2.0
      - name: Set up Temurin JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Validate release provenance and version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag_name="${GITHUB_REF_NAME}"
          if [[ ! "${tag_name}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Ref ${tag_name} is not a stable vX.Y.Z tag." >&2
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Release tag commit ${GITHUB_SHA} is not contained in origin/main." >&2
            exit 1
          fi

          version="${tag_name#v}"
          release_note="docs/releases/${tag_name}.md"
          if [[ ! -s "${release_note}" ]]; then
            echo "Required non-empty release note ${release_note} is missing at the tag." >&2
            exit 1
          fi

          project_version="$(mvn --batch-mode --quiet -DforceStdout help:evaluate -Dexpression=project.version)"
          if [[ "${project_version}" != "${version}" ]]; then
            echo "Tag version ${version} does not match root Maven project version ${project_version}." >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "image=ghcr.io/g2rain/g2rain-mcp-registry" >> "${GITHUB_OUTPUT}"

      - name: Build and test
        run: mvn --batch-mode clean verify

      # v4.0.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push both immutable tags with Jib
        run: >-
          mvn --batch-mode -pl g2rain-mcp-registry-startup -am compile jib:build
          -Djib.to.image=${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
          -Djib.to.tags=sha-${{ github.sha }}

      - name: Publish summary
        run: |
          {
            echo '## GHCR publication succeeded'
            echo
            echo 'Both requested image tags were pushed:'
            echo "- \`${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}\`"
            echo "- \`${{ steps.release.outputs.image }}:sha-${{ github.sha }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
