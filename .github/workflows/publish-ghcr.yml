name: Publish GHCR image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish-maven:
    needs: publish
    uses: ./.github/workflows/publish-maven.yml
    permissions:
      contents: read
      packages: write

  publish:
    name: Verify and publish GHCR image
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # v6.0.3
      - name: Check out the release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      # v5.2.0
      - name: Set up Temurin JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Configure G2rain Maven repositories
        shell: bash
        run: |
          set -euo pipefail
          settings_path="$RUNNER_TEMP/g2rain-maven-settings.xml"
          python3 - "$settings_path" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.Element('settings', xmlns='http://maven.apache.org/SETTINGS/1.0.0')
          servers = ET.SubElement(root, 'servers')
          profile = ET.SubElement(ET.SubElement(root, 'profiles'), 'profile')
          ET.SubElement(profile, 'id').text = 'g2rain-packages'
          repositories = ET.SubElement(profile, 'repositories')
          for name in ('g2rain-common', 'g2rain-spring-boot-starter', 'g2rain-basis', 'g2rain-mybatis-extensions'):
              server = ET.SubElement(servers, 'server')
              ET.SubElement(server, 'id').text = name
              ET.SubElement(server, 'username').text = '${env.GITHUB_ACTOR}'
              ET.SubElement(server, 'password').text = '${env.GITHUB_TOKEN}'
              repository = ET.SubElement(repositories, 'repository')
              ET.SubElement(repository, 'id').text = name
              ET.SubElement(repository, 'url').text = f'https://maven.pkg.github.com/g2rain/{name}'
              ET.SubElement(ET.SubElement(repository, 'releases'), 'enabled').text = 'true'
              ET.SubElement(ET.SubElement(repository, 'snapshots'), 'enabled').text = 'false'
          plugin_repositories = ET.SubElement(profile, 'pluginRepositories')
          plugin = ET.SubElement(plugin_repositories, 'pluginRepository')
          ET.SubElement(plugin, 'id').text = 'g2rain-crafter'
          ET.SubElement(plugin, 'url').text = 'https://maven.pkg.github.com/g2rain/g2rain-crafter'
          server = ET.SubElement(servers, 'server')
          ET.SubElement(server, 'id').text = 'g2rain-crafter'
          ET.SubElement(server, 'username').text = '${env.GITHUB_ACTOR}'
          ET.SubElement(server, 'password').text = '${env.GITHUB_TOKEN}'
          ET.SubElement(ET.SubElement(root, 'activeProfiles'), 'activeProfile').text = 'g2rain-packages'
          ET.ElementTree(root).write(sys.argv[1], encoding='utf-8', xml_declaration=True)
          PY
          chmod 600 "$settings_path"
          echo "MAVEN_SETTINGS=$settings_path" >> "$GITHUB_ENV"
          echo 'Configured g2rain-common, g2rain-spring-boot-starter, g2rain-basis, g2rain-mybatis-extensions, g2rain-crafter.'

      - name: Validate release provenance and version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag_name="${GITHUB_REF_NAME}"
          if [[ ! "${tag_name}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Ref ${tag_name} is not a stable vX.Y.Z tag." >&2
            exit 1
          fi

          git fetch --no-tags origin main
          release_commit="$(git rev-list -n 1 "${GITHUB_REF}")"
          if ! git merge-base --is-ancestor "${release_commit}" origin/main; then
            echo "Release tag commit ${GITHUB_SHA} is not contained in origin/main." >&2
            exit 1
          fi

          version="${tag_name#v}"
          release_note="docs/releases/${tag_name}.md"
          if ! git cat-file -e "${release_commit}:${release_note}" 2>/dev/null || [[ -z "$(git show "${release_commit}:${release_note}" | tr -d '[:space:]')" ]]; then
            echo "Required non-empty release note ${release_note} is missing at the tag." >&2
            exit 1
          fi

          project_version="$(mvn --settings "$MAVEN_SETTINGS" --batch-mode --quiet -DforceStdout help:evaluate -Dexpression=project.version)"
          if [[ "${project_version}" != "${version}" ]]; then
            echo "Tag version ${version} does not match root Maven project version ${project_version}." >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "commit=${release_commit}" >> "${GITHUB_OUTPUT}"
          echo "image=ghcr.io/g2rain/g2rain-mcp-registry" >> "${GITHUB_OUTPUT}"

      - name: Build and test all modules
        run: mvn --settings "$MAVEN_SETTINGS" --batch-mode --no-transfer-progress -U clean install

      # v4.0.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push both immutable tags with Jib
        working-directory: g2rain-mcp-registry-startup
        env:
          IMAGE_NAME: ${{ steps.release.outputs.image }}
          IMAGE_TAG: ${{ steps.release.outputs.version }}
          EXTRA_TAGS: sha-${{ steps.release.outputs.commit }}
        run: |
          args=()
          if [[ -n "$EXTRA_TAGS" ]]; then
            args+=("-Djib.to.tags=$EXTRA_TAGS")
          fi
          mvn --settings "$MAVEN_SETTINGS" --batch-mode --no-transfer-progress -DskipTests=true compile jib:build \
            "-Djib.to.image=$IMAGE_NAME:$IMAGE_TAG" \
            "${args[@]}"

      - name: Publish summary
        run: |
          {
            echo '## GHCR publication succeeded'
            echo
            echo 'Both requested image tags were pushed:'
            echo "- \`${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}\`"
            echo "- \`${{ steps.release.outputs.image }}:sha-${{ steps.release.outputs.commit }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
