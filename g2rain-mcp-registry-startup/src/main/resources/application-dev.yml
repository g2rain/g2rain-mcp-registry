# profile=dev 时加载；与 nacos 互斥，勿同时激活
spring:
  cloud:
    nacos:
      config:
        enabled: false
        import-check:
          enabled: false
      discovery:
        enabled: false
  datasource:
    host: localhost
    port: 3306
    database: g2rain_mcp_registry
    username: root
    password: 1qaZXsw2
    url: jdbc:mysql://${spring.datasource.host}:${spring.datasource.port}/${spring.datasource.database}?useUnicode=true&characterEncoding=utf-8&useSSL=true&zeroDateTimeBehavior=convertToNull&serverTimezone=GMT%2B8
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      validation-timeout: 3000
      idle-timeout: 30000
      max-lifetime: 300000
      minimum-idle: 1
      maximum-pool-size: 10
      connection-test-query: select 1

logging:
  level:
    com.g2rain.mcp.registry.dao: debug
    # 你自己的 handler / patcher
    com.g2rain.mcp.registry.tool: debug
    com.g2rain.mcp.registry.config: debug
    # MCP SDK（协议、session、handler 分发）
    io.modelcontextprotocol: debug
    # Spring AI MCP 传输层（HTTP 进出的 initialize / tools/list / call）
    org.springframework.ai.mcp: debug
    org.springframework.ai.mcp.server.webmvc: trace   # 想看更细的 HTTP/SSE 再开 trace
    # 可选：看 Spring MVC 请求映射
    org.springframework.web.servlet: debug
