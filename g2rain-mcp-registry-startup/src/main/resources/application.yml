server:
  port: ${SERVER_PORT:8080}

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: g2rain-mcp-registry
  ai:
    mcp:
      server:
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
        enabled: true
        name: ${spring.application.name}
        version: 1.0.0
        type: SYNC
        protocol: STATELESS # 枚举值:[STATELESS | STREAMABLE]
        tool-callback-converter: false
        annotation-scanner:
          enabled: false
        streamable-http:
          mcp-endpoint: /mcp

  # 环境切换（dev / nacos 互斥，勿同时激活或 spring.profiles.include）：
  #   SPRING_PROFILES_ACTIVE=dev   → application.yml + application-dev.yml（本地数据源）
  #   SPRING_PROFILES_ACTIVE=nacos → application.yml + application-nacos.yml（注册/配置中心，数据源来自 Nacos）
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:nacos}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis:
  mapper-locations: classpath:/mybatis/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    jdbc-type-for-null: NULL

g2rain:
  springdoc:
    description: MCP 注册接口文档
  mcp:
    registry:
      progress-notification-interval-ms: 1
      # 本地联调预注册 CMS Tool 的下游基址（支持 lb:// 与 http://）
      local-cms-endpoint: lb://g2rain-cms

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
  endpoint:
    health:
      show-details: when_authorized
